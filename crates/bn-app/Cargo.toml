[package]
name = "bn-app"
version = "0.10.0"
edition = "2024"
license = "MIT"

# dx names the bundle after the bin target (PascalCase), so this yields
# Balina.app instead of BnApp.app.
[[bin]]
name = "balina"
path = "src/main.rs"

# The features only select the Dioxus renderer; platform code gates on
# `target_arch = "wasm32"` and target-specific dependency tables below.
# Web build: --no-default-features --features web --target wasm32-unknown-unknown
[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]

[dependencies]
bn-core = { path = "../bn-core" }
bn-session = { path = "../bn-session" }
dioxus = { version = "0.7" }
icons = { version = "0.18", features = ["dioxus"] }
markdown = "1.0"
rfd = "0.15" # native pickers on desktop; <input type=file> open picker on wasm
slotmap = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ai = "0.8"
dirs = "6"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

# Local structured-decision model (candle). Metal on macOS; CPU elsewhere
# (the crate's device auto-pick degrades to CPU either way).
[target.'cfg(target_os = "macos")'.dependencies]
laya = { version = "0.1", features = ["metal"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "macos")))'.dependencies]
laya = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = "0.22"
bn-worker = { path = "../bn-worker" } # protocol types only (rlib)
futures-channel = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Location",
    "MessageEvent",
    "Request",
    "RequestInit",
    "Response",
    "Url",
    "UrlSearchParams",
    "Window",
    "Worker",
] }

[lints.clippy]
await_holding_lock = "deny"
