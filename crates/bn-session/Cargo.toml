[package]
name = "bn-session"
version = "0.7.0"
edition = "2024"
license = "MIT"

[dependencies]
bn-core = { path = "../bn-core" }
slotmap = "1.1"
thiserror = "2.0"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
web-time = "1.1"

# rand's entropy source in the browser (no-op on native targets).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
serde_json = "1"
