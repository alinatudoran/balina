[package]
name = "bn-worker"
version = "0.9.0"
edition = "2024"
license = "MIT"

# cdylib: the Web Worker wasm module (built by scripts/build-worker.sh).
# rlib: lets bn-app import the message-protocol types.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bn-core = { path = "../bn-core" }
bn-session = { path = "../bn-session" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope"] }
