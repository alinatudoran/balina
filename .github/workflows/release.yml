name: Release

on:
  release:
    types: [created]

permissions:
  contents: write   # needed for gh release upload

jobs:
  build-macos-aarch64:
    name: macOS AArch64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/bn-app -> ../../target

      - uses: cargo-bins/cargo-binstall@main

      - name: Install dioxus-cli
        run: cargo binstall dioxus-cli --no-confirm --locked

      - name: Bundle
        working-directory: crates/bn-app
        run: dx bundle --release

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            target/dx/balina/bundle/macos/macos/*.dmg \
            --clobber

  build-linux-amd64:
    name: Linux AMD64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/bn-app -> ../../target

      - uses: cargo-bins/cargo-binstall@main

      - name: Install dioxus-cli
        run: cargo binstall dioxus-cli --no-confirm --locked

      - name: Bundle
        working-directory: crates/bn-app
        run: dx bundle --release

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            target/dx/balina/bundle/linux/appimage/*.AppImage \
            --clobber

  build-linux-aarch64:
    name: Linux AArch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/bn-app -> ../../target

      - uses: cargo-bins/cargo-binstall@main

      - name: Install dioxus-cli
        run: cargo binstall dioxus-cli --no-confirm --locked

      - name: Bundle
        working-directory: crates/bn-app
        run: dx bundle --release

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            target/dx/balina/bundle/linux/appimage/*.AppImage \
            --clobber

  build-windows-amd64:
    name: Windows AMD64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/bn-app -> ../../target

      - uses: cargo-bins/cargo-binstall@main

      - name: Install dioxus-cli
        run: cargo binstall dioxus-cli --no-confirm --locked

      - name: Bundle
        working-directory: crates/bn-app
        run: dx bundle --release

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ github.ref_name }}" \
            target/dx/balina/bundle/windows/nsis/*.exe \
            --clobber
